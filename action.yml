name: ToolAtlas Agent Supply-Chain Gate
description: Scan agent context and MCP configuration without executing repository content
inputs:
  path:
    description: Repository path to scan
    required: false
    default: .
  fail-on-high:
    description: Fail the job when high or critical findings exist
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install ToolAtlas
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Scan repository
      shell: bash
      run: |
        set +e
        toolatlas repo-scan "${{ inputs.path }}" --format sarif --output toolatlas.sarif
        code=$?
        set -e
        if [ "${{ inputs.fail-on-high }}" = "true" ] && [ "$code" -eq 3 ]; then exit 3; fi
        if [ "$code" -gt 3 ]; then exit "$code"; fi
    - name: Upload ToolAtlas SARIF
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: toolatlas.sarif
    - name: Upload ToolAtlas report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: toolatlas-report
        path: toolatlas.sarif
