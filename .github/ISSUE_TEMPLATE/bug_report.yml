name: Bug report
description: Report a reproducible defect in ToolAtlas
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest safe catalog and exact command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ToolAtlas version
    validations:
      required: true
