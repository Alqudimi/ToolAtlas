name: Feature request
description: Propose a focused, evidence-driven improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed contract
      description: Describe the CLI or library behavior and compatibility impact.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: How can the behavior be tested deterministically and offline?
    validations:
      required: true
